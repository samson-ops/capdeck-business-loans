<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply | CapDeck</title>
<meta name="description" content="Start your CapDeck funding application.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF4FF}
.show-sm{display:none}
@media (max-width:700px){.show-sm{display:block !important}}
a{color:#0A0B0D}a:hover{color:#0066FF}
button,input,select{font-family:inherit}
button{cursor:pointer}
.inp{width:100%;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid #8A93A3;border-radius:10px;background:#FFFFFF;color:#0A0B0D;font-size:16px}
.inp[aria-invalid="true"]{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.btn{transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
a:focus-visible,button:focus-visible{outline:3px solid #0066FF;outline-offset:3px}
input:focus-visible,select:focus-visible{outline:3px solid #0066FF;outline-offset:1px}
@media (max-width:700px){.hide-sm{display:none !important}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<noscript><p style="font-family: system-ui, sans-serif; padding: 24px">This page needs JavaScript turned on.</p></noscript>
<div id="root"></div>
<template id="tpl">
<div style="font-family: 'Geist', system-ui, sans-serif; color: #0A0B0D; background: #EEF4FF; line-height: 1.5; font-size: 17px; min-height: 100vh">

<div style="background: #FFFFFF; border-bottom: 1px solid #E3E7EE; color: #4A5261; font-size: 14px; text-align: center; padding: 8px 16px">Prototype with sample data. Nothing you enter here is saved or sent.</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E7EE">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px clamp(16px, 3vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; min-height: 44px"><img src="assets/capdeck-logo.png" alt="CapDeck home" width="1919" height="295" style="display: block; height: clamp(22px, 2vw, 28px); width: auto"></a>
<div style="display: flex; align-items: center; gap: 8px 24px; font-size: 15px">
<span class="hide-sm" style="color: #4A5261">Questions? <a href="tel:" style="font-weight: 600">[PHONE NUMBER]</a></span>
<a href="signin.html" style="display: flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none">Sign in</a>
</div>
</div>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 3vw, 32px) 72px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">
<div style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DEEC; border-radius: 16px; box-shadow: 0 18px 36px -26px rgba(10, 11, 13, 0.35); padding: clamp(20px, 3vw, 40px)">

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #E3E7EE; display: flex; flex-direction: column; gap: 12px">
<ol aria-label="Application steps" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: flex-start">
<sc-for list="{{steps}}" as="item" hint-placeholder-count="6">
<li aria-current="{{item.current}}" style="flex: {{item.flex}}; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center">
<div style="flex: none; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{item.bg}}; color: {{item.fg}}; border: 1.5px solid {{item.bd}}">
<sc-if value="{{item.done}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{item.todo}}" hint-placeholder-val="{{true}}"><span>{{item.num}}</span></sc-if>
</div>
<sc-if value="{{item.line}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="flex: 1; height: 2px; margin: 0 8px; border-radius: 2px; background: {{item.lineBg}}"></div></sc-if>
</div>
<div class="hide-sm" style="font-size: 13px; font-weight: {{item.weight}}; color: {{item.labelFg}}">{{item.label}}</div>
</li>
</sc-for>
</ol>
<div class="show-sm" style="font-size: 14px; color: #4A5261">Step {{stepNum}} of 6: {{stepName}}</div>
</div>
</sc-if>

<sc-if value="{{is1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.02em; line-height: 1.1">What do you need?</h1>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px">
<label for="amount" style="font-size: 15px; font-weight: 600">How much do you need?</label>
<div style="font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 32px; line-height: 1; letter-spacing: -0.02em; color: {{accent}}">{{amountText}}</div>
</div>
<input id="amount" name="amount" type="range" min="5000" max="2000000" step="5000" value="{{v.amount}}" aria-valuetext="{{amountText}}" onChange="{{on.amount}}" style="width: 100%; height: 36px; margin: 0; accent-color: {{accent}}; cursor: pointer">
<div aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 13px; color: #4A5261"><span>$5K</span><span>$2M</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div id="purpose-label" style="font-size: 15px; font-weight: 600">What will you use it for?</div>
<div role="group" aria-labelledby="purpose-label" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{purposes}}" as="item" hint-placeholder-count="6">
<button type="button" aria-pressed="{{item.on}}" onClick="{{item.pick}}" style="flex: 1 1 30%; min-width: 140px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 10px; font-size: 15px; font-weight: 500; text-align: left; background: {{item.bg}}; color: {{item.fg}}; border: 1.5px solid {{item.bd}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{item.icon}}"></path></svg>{{item.label}}</button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{is2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.02em; line-height: 1.1">Tell us about your business</h1>
<p style="margin: 0; color: #4A5261">The basics lenders need to see if you qualify.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bizName" style="font-size: 14px; font-weight: 600">Legal business name</label>
<input class="inp" id="bizName" name="bizName" type="text" autocomplete="organization" value="{{v.bizName}}" onChange="{{on.bizName}}" aria-invalid="{{bad.bizName}}">
<sc-if value="{{err.bizName}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.bizName}}</div></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="dba" style="font-size: 14px; font-weight: 600">Doing business as <span style="font-weight: 400; color: #4A5261">(optional)</span></label>
<input class="inp" id="dba" name="dba" type="text" value="{{v.dba}}" onChange="{{on.dba}}">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="industry" style="font-size: 14px; font-weight: 600">Industry</label>
<select class="inp" id="industry" name="industry" value="{{v.industry}}" onChange="{{on.industry}}" aria-invalid="{{bad.industry}}">
<option value="">Select</option>
<option value="restaurant">Restaurant and food service</option>
<option value="retail">Retail</option>
<option value="construction">Construction and trades</option>
<option value="transport">Transportation and logistics</option>
<option value="health">Health and wellness</option>
<option value="professional">Professional services</option>
<option value="manufacturing">Manufacturing</option>
<option value="other">Other</option>
</select>
<sc-if value="{{err.industry}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.industry}}</div></sc-if>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="structure" style="font-size: 14px; font-weight: 600">Business structure</label>
<select class="inp" id="structure" name="structure" value="{{v.structure}}" onChange="{{on.structure}}" aria-invalid="{{bad.structure}}">
<option value="">Select</option>
<option value="llc">LLC</option>
<option value="corp">Corporation</option>
<option value="sole">Sole proprietorship</option>
<option value="partnership">Partnership</option>
</select>
<sc-if value="{{err.structure}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.structure}}</div></sc-if>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="startDate" style="font-size: 14px; font-weight: 600">Business start date</label>
<input class="inp" id="startDate" name="startDate" type="text" inputmode="numeric" placeholder="MM/YYYY" maxlength="7" value="{{v.startDate}}" onChange="{{on.startDate}}" aria-invalid="{{bad.startDate}}">
<sc-if value="{{err.startDate}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.startDate}}</div></sc-if>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="ein" style="font-size: 14px; font-weight: 600">Employer ID number (EIN)</label>
<input class="inp" id="ein" name="ein" type="text" inputmode="numeric" autocomplete="off" placeholder="12-3456789" maxlength="10" value="{{v.ein}}" onChange="{{on.ein}}" aria-invalid="{{bad.ein}}">
<sc-if value="{{err.ein}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.ein}}</div></sc-if>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bizStreet" style="font-size: 14px; font-weight: 600">Business street address</label>
<input class="inp" id="bizStreet" name="bizStreet" type="text" autocomplete="address-line1" value="{{v.bizStreet}}" onChange="{{on.bizStreet}}" aria-invalid="{{bad.bizStreet}}">
<sc-if value="{{err.bizStreet}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.bizStreet}}</div></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 2 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="bizCity" style="font-size: 14px; font-weight: 600">City</label>
<input class="inp" id="bizCity" name="bizCity" type="text" autocomplete="address-level2" value="{{v.bizCity}}" onChange="{{on.bizCity}}" aria-invalid="{{bad.bizCity}}">
<sc-if value="{{err.bizCity}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.bizCity}}</div></sc-if>
</div>
<div style="flex: 1 1 90px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="bizState" style="font-size: 14px; font-weight: 600">State</label>
<input class="inp" id="bizState" name="bizState" type="text" autocomplete="address-level1" placeholder="NY" maxlength="2" value="{{v.bizState}}" onChange="{{on.bizState}}" aria-invalid="{{bad.bizState}}">
<sc-if value="{{err.bizState}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.bizState}}</div></sc-if>
</div>
<div style="flex: 1 1 110px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="zip" style="font-size: 14px; font-weight: 600">ZIP code</label>
<input class="inp" id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" value="{{v.zip}}" onChange="{{on.zip}}" aria-invalid="{{bad.zip}}">
<sc-if value="{{err.zip}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.zip}}</div></sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{is3}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.02em; line-height: 1.1">Revenue and credit</h1>
<p style="margin: 0; color: #4A5261">Estimates are fine at this stage.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="revenue" style="font-size: 14px; font-weight: 600">Average monthly revenue</label>
<select class="inp" id="revenue" name="revenue" value="{{v.revenue}}" onChange="{{on.revenue}}" aria-invalid="{{bad.revenue}}">
<option value="">Select</option>
<option value="under10">Under $10,000</option>
<option value="10to25">$10,000 to $25,000</option>
<option value="25to50">$25,000 to $50,000</option>
<option value="50to100">$50,000 to $100,000</option>
<option value="100to250">$100,000 to $250,000</option>
<option value="over250">Over $250,000</option>
</select>
<sc-if value="{{err.revenue}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.revenue}}</div></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="credit" style="font-size: 14px; font-weight: 600">Your estimated personal credit score</label>
<select class="inp" id="credit" name="credit" value="{{v.credit}}" onChange="{{on.credit}}" aria-invalid="{{bad.credit}}">
<option value="">Select</option>
<option value="720">720 or higher</option>
<option value="680">680 to 719</option>
<option value="640">640 to 679</option>
<option value="600">600 to 639</option>
<option value="under600">Below 600</option>
<option value="unsure">Not sure</option>
</select>
<div style="font-size: 14px; color: #4A5261">Your own estimate. Answering this does not affect your credit.</div>
<sc-if value="{{err.credit}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.credit}}</div></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div id="loans-label" style="font-size: 14px; font-weight: 600">Do you have any open business loans or advances?</div>
<div role="group" aria-labelledby="loans-label" style="display: flex; gap: 8px">
<button type="button" aria-pressed="{{loanYes.on}}" onClick="{{loanYes.pick}}" style="min-width: 96px; min-height: 48px; padding: 0 20px; border-radius: 10px; font-size: 16px; font-weight: 500; background: {{loanYes.bg}}; color: {{loanYes.fg}}; border: 1.5px solid {{loanYes.bd}}">Yes</button>
<button type="button" aria-pressed="{{loanNo.on}}" onClick="{{loanNo.pick}}" style="min-width: 96px; min-height: 48px; padding: 0 20px; border-radius: 10px; font-size: 16px; font-weight: 500; background: {{loanNo.bg}}; color: {{loanNo.fg}}; border: 1.5px solid {{loanNo.bd}}">No</button>
</div>
<sc-if value="{{err.hasLoans}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.hasLoans}}</div></sc-if>
</div>
<sc-if value="{{showLoanBalance}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="loanBalance" style="font-size: 14px; font-weight: 600">About how much do you still owe on them?</label>
<select class="inp" id="loanBalance" name="loanBalance" value="{{v.loanBalance}}" onChange="{{on.loanBalance}}" aria-invalid="{{bad.loanBalance}}">
<option value="">Select</option>
<option value="under25">Under $25,000</option>
<option value="25to100">$25,000 to $100,000</option>
<option value="100to250">$100,000 to $250,000</option>
<option value="over250">Over $250,000</option>
</select>
<sc-if value="{{err.loanBalance}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.loanBalance}}</div></sc-if>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{is4}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 2.6vw, 34px); letter-spacing: -0.02em; line-height: 1.1">About the business owner</h1>
<p style="margin: 0; color: #4A5261">Details for the owner who is applying. Lenders use them to confirm your identity.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="first" style="font-size: 14px; font-weight: 600">First name</label>
<input class="inp" id="first" name="first" type="text" autocomplete="given-name" value="{{v.first}}" onChange="{{on.first}}" aria-invalid="{{bad.first}}">
<sc-if value="{{err.first}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.first}}</div></sc-if>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="last" style="font-size: 14px; font-weight: 600">Last name</label>
<input class="inp" id="last" name="last" type="text" autocomplete="family-name" value="{{v.last}}" onChange="{{on.last}}" aria-invalid="{{bad.last}}">
<sc-if value="{{err.last}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.last}}</div></sc-if>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="ownership" style="font-size: 14px; font-weight: 600">Ownership (%)</label>
<input class="inp" id="ownership" name="ownership" type="text" inputmode="numeric" maxlength="3" value="{{v.ownership}}" onChange="{{on.ownership}}" aria-invalid="{{bad.ownership}}">
<sc-if value="{{err.ownership}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.ownership}}</div></sc-if>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="dob" style="font-size: 14px; font-weight: 600">Date of birth</label>
<input class="inp" id="dob" name="dob" type="text" inputmode="numeric" autocomplete="bday" placeholder="MM/DD/YYYY" maxlength="10" value="{{v.dob}}" onChange="{{on.dob}}" aria-invalid="{{bad.dob}}">
<sc-if value="{{err.dob}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.dob}}</div></sc-if>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ssn" style="font-size: 14px; font-weight: 600">Social Security number</label>
<input class="inp" id="ssn" name="ssn" type="text" inputmode="numeric" autocomplete="off" placeholder="123-45-6789" maxlength="11" value="{{v.ssn}}" onChange="{{on.ssn}}" aria-invalid="{{bad.ssn}}">
<div style="font-size: 14px; color: #4A5261">Used only to verify your identity and check credit. [ADD YOUR CREDIT-CHECK DISCLOSURE]</div>
<sc-if value="{{err.ssn}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.ssn}}</div></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="homeStreet" style="font-size: 14px; font-weight: 600">Home street address</label>
<input class="inp" id="homeStreet" name="homeStreet" type="text" autocomplete="address-line1" value="{{v.homeStreet}}" onChange="{{on.homeStreet}}" aria-invalid="{{bad.homeStreet}}">
<sc-if value="{{err.homeStreet}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.homeStreet}}</div></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 16px">
<div style="flex: 2 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="homeCity" style="font-size: 14px; font-weight: 600">City</label>
<input class="inp" id="homeCity" name="homeCity" type="text" autocomplete="address-level2" value="{{v.homeCity}}" onChange="{{on.homeCity}}" aria-invalid="{{bad.homeCity}}">
<sc-if value="{{err.homeCity}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.homeCity}}</div></sc-if>
</div>
<div style="flex: 1 1 90px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="homeState" style="font-size: 14px; font-weight: 600">State</label>
<input class="inp" id="homeState" name="homeState" type="text" autocomplete="address-level1" placeholder="NY" maxlength="2" value="{{v.homeState}}" onChange="{{on.homeState}}" aria-invalid="{{bad.homeState}}">
<sc-if value="{{err.homeState}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.homeState}}</div></sc-if>
</div>
<div style="flex: 1 1 110px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="homeZip" style="font-size: 14px; font-weight: 600">ZIP code</label>
<input class="inp" id="homeZip" name="homeZip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" value="{{v.homeZip}}" onChange="{{on.homeZip}}" aria-invalid="{{bad.homeZip}}">

<script>
/* Small page runtime: renders the page template from the Component's values and keeps it in sync. */
(function () {
  'use strict';
  var HOLE = /\{\{([^}]+)\}\}/g;
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  function text(v) {
    return v == null || v === false ? '' : String(v);
  }

  function fill(str, scope) {
    return str.replace(HOLE, function (_, p) { return text(lookup(scope, p)); });
  }

  function eventFor(el, name) {
    var type = name.slice(2).toLowerCase();
    if (type === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' && t !== 'file')) return 'input';
    }
    return type;
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(fill(node.data, scope)));
      return;
    }
    if (node.nodeType !== 1) return;

    if (tag === 'sc-for') {
      var m = WHOLE.exec(node.getAttribute('list') || '');
      var list = m ? lookup(scope, m[1]) : null;
      var as = node.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var inner = Object.create(scope);
        inner[as] = item;
        inner.$index = idx;
        for (var k = node.firstChild; k; k = k.nextSibling) build(k, inner, out);
      });

    }
    if (tag === 'sc-if') {
      var mi = WHOLE.exec(node.getAttribute('value') || '');
      if (mi && lookup(scope, mi[1])) for (c = node.firstChild; c; c = c.nextSibling) build(c, scope, out);
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName), handlers = null;
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, w = WHOLE.exec(a.value);
      if (w) {
        var raw = lookup(scope, w[1]);
        if (name.slice(0, 2) === 'on') {
          if (typeof raw === 'function') (handlers = handlers || {})[name] = raw;
        } else if (raw === true) {
          el.setAttribute(name, name.slice(0, 5) === 'aria-' ? 'true' : '');
        } else if (raw === false) {
          if (name.slice(0, 5) === 'aria-') el.setAttribute(name, 'false');
        } else if (raw != null) {
          el.setAttribute(name, String(raw));
        }
      } else {
        el.setAttribute(name, fill(a.value, scope));
      }
    }
    if (handlers) {
      el.__h = {};
      for (var key in handlers) el.__h[eventFor(el, key)] = handlers[key];
    }
    for (c = node.firstChild; c; c = c.nextSibling) build(c, scope, el);
    out.appendChild(el);
  }

  function syncAttrs(live, next) {
    var i, a;
    for (i = live.attributes.length - 1; i >= 0; i--) {
      a = live.attributes[i];
      if (!next.hasAttribute(a.name)) live.removeAttribute(a.name);
    }
    for (i = 0; i < next.attributes.length; i++) {
      a = next.attributes[i];
      if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
    }
    live.__h = next.__h || null;
  }

  function syncControl(live, next) {
    var tag = live.tagName;
    if (tag === 'INPUT') {
      var t = (live.getAttribute('type') || '').toLowerCase();
      if (t === 'checkbox' || t === 'radio') {
        var on = next.hasAttribute('checked');
        if (live.checked !== on) live.checked = on;
      } else if (t !== 'file' && next.hasAttribute('value') && live.value !== next.getAttribute('value')) {
        live.value = next.getAttribute('value');
      }
    } else if ((tag === 'SELECT' || tag === 'TEXTAREA') && next.hasAttribute('value') && live.value !== next.getAttribute('value')) {
      live.value = next.getAttribute('value');
    }
  }

  function settle(node) {
    if (node.nodeType !== 1) return;
    var all = [node].concat([].slice.call(node.querySelectorAll('*')));
    all.forEach(function (el) { if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') syncControl(el, el); });
  }

  function sameKind(live, next) {

    if (live.nodeType !== 1) return true;

    if ((live.getAttribute('id') || '') !== (next.getAttribute('id') || '')) return false;

  function morph(liveParent, nextParent) {

    while (next) {

      if (!live) {

  function DCLogic(props) {
    this.props = props || {};

  window.mountPage = function (Component, props) {
    var root = document.getElementById('root');
    var tpl = document.getElementById('tpl').content;
    var page = new Component(props);
    var queued = false;

    function render() {
      queued = false;
      var vals = page.renderVals() || {};
      var next = document.createElement('div');
      for (var n = tpl.firstChild; n; n = n.nextSibling) build(n, vals, next);

    page.__render = function () {
      if (queued) return;
      queued = true;
      Promise.resolve().then(render);
    };

    ['click', 'input', 'change', 'submit'].forEach(function (type) {
      root.addEventListener(type, function (e) {
        var n = e.target;

</script>
<script>
class Component extends DCLogic {
  state = {
    step: 1, done: false, amount: 75000, purpose: 'working',
    bizName: '', dba: '', industry: '', structure: '', startDate: '', ein: '',
    bizStreet: '', bizCity: '', bizState: '', zip: '',
    revenue: '', credit: '', hasLoans: '', loanBalance: '',
    first: '', last: '', ownership: '', dob: '', ssn: '',
    homeStreet: '', homeCity: '', homeState: '', homeZip: '', email: '', phone: '',
    bankConnected: false, files: [],
    password: '', consent: false, consentCredit: false, signature: '',
    errors: {}
  };

  componentDidMount() {
    try {
      var q = new URLSearchParams(window.location.search), patch = {};
      var a = Number(q.get('amount')), p = q.get('purpose');
      if (a >= 5000 && a <= 2000000) patch.amount = a;
      if (p && this.purposeList().some(function (x) { return x.id === p; })) patch.purpose = p;
      if (patch.amount || patch.purpose) { patch.step = 2; this.setState(patch); }
    } catch (e) {}
  }

  purposeList() {
    return [
      { id: 'working', label: 'Working capital', icon: 'M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3M3 7.5V17a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5.5A2.5 2.5 0 0 1 3 7.5ZM16 13.5h.5' },
      { id: 'equipment', label: 'Equipment', icon: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z' },
      { id: 'inventory', label: 'Inventory', icon: 'M21 8l-9-5-9 5v8l9 5 9-5V8ZM3 8l9 5 9-5M12 13v8' },
      { id: 'expansion', label: 'Expansion', icon: 'M3 17l6-6 4 4 8-8M15 7h6v6' },
      { id: 'payroll', label: 'Payroll', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75' },
      { id: 'other', label: 'Something else', icon: 'M5 12h.01M12 12h.01M19 12h.01' }
    ];
  }

  check(s) {
    var e = {};
    var states = ' AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY ';
    function digits(v) { return String(v).replace(/\D/g, ''); }
    function isState(v) { return /^[A-Z]{2}$/.test(v) && states.indexOf(' ' + v + ' ') >= 0; }
    var now = new Date();
    if (s.step === 2) {
      if (!s.bizName.trim()) e.bizName = 'Enter your legal business name.';
      if (!s.industry) e.industry = 'Choose an industry.';
      if (!s.structure) e.structure = 'Choose a business structure.';
      var sd = /^(0[1-9]|1[0-2])\/((?:19|20)\d{2})$/.exec(s.startDate.trim());
      if (!sd || new Date(Number(sd[2]), Number(sd[1]) - 1, 1) > now) e.startDate = 'Enter the month and year as MM/YYYY.';
      if (digits(s.ein).length !== 9) e.ein = 'Enter your 9-digit EIN.';
      if (!s.bizStreet.trim()) e.bizStreet = 'Enter the business street address.';
      if (!s.bizCity.trim()) e.bizCity = 'Enter the city.';
      if (!isState(s.bizState)) e.bizState = 'Use a 2-letter state.';
      if (!/^\d{5}$/.test(s.zip.trim())) e.zip = 'Enter a 5-digit ZIP.';
    } else if (s.step === 3) {
      if (!s.revenue) e.revenue = 'Choose your average monthly revenue.';
      if (!s.credit) e.credit = 'Choose a credit score range.';
      if (!s.hasLoans) e.hasLoans = 'Choose yes or no.';
      if (s.hasLoans === 'yes' && !s.loanBalance) e.loanBalance = 'Choose an approximate balance.';
    } else if (s.step === 4) {
      if (!s.first.trim()) e.first = 'Enter your first name.';
      if (!s.last.trim()) e.last = 'Enter your last name.';
      var own = Number(s.ownership);
      if (!/^\d{1,3}$/.test(s.ownership.trim()) || own < 1 || own > 100) e.ownership = 'Enter a number from 1 to 100.';
      var bd = /^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])\/((?:19|20)\d{2})$/.exec(s.dob.trim());
      var born = bd ? new Date(Number(bd[3]), Number(bd[1]) - 1, Number(bd[2])) : null;
      if (!born || born.getMonth() !== Number(bd[1]) - 1) e.dob = 'Enter your date of birth as MM/DD/YYYY.';
      else if (new Date(born.getFullYear() + 18, born.getMonth(), born.getDate()) > now) e.dob = 'You must be at least 18 to apply.';
      if (digits(s.ssn).length !== 9) e.ssn = 'Enter your 9-digit Social Security number.';
      if (!s.homeStreet.trim()) e.homeStreet = 'Enter your home street address.';
      if (!s.homeCity.trim()) e.homeCity = 'Enter the city.';
      if (!isState(s.homeState)) e.homeState = 'Use a 2-letter state.';
      if (!/^\d{5}$/.test(s.homeZip.trim())) e.homeZip = 'Enter a 5-digit ZIP.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())) e.email = 'Enter a valid email address.';
      if (digits(s.phone).length < 10) e.phone = 'Enter a 10-digit phone number.';
    } else if (s.step === 5) {
      if (!s.bankConnected && !s.files.length) e.bank = 'Connect your bank or upload statements, or skip this step for now.';
    } else if (s.step === 6) {
      if (s.password.length < 8) e.password = 'Use at least 8 characters.';
      if (!s.consent) e.consent = 'Please agree before submitting.';
      if (!s.consentCredit) e.consentCredit = 'Please authorize the credit check before submitting.';
      if (s.signature.trim().split(/\s+/).length < 2) e.signature = 'Type your first and last name to sign.';
    }
    return e;
  }

  toTop() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  remember(s, purposeLabel) {
    try {
      window.sessionStorage.setItem('capdeck_request', JSON.stringify({ amount: s.amount, purpose: purposeLabel, first: s.first.trim() }));
    } catch (e) {}
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var accent = this.props.accent ?? '#0066FF';
    var strict = this.props.requireFields ?? true;
    var errors = s.errors || {};
    var names = ['', 'Funding need', 'Your business', 'Revenue and credit', 'Business owner', 'Bank information', 'Review and sign'];
    var last = 6;
    var amountText = '$' + Number(s.amount).toLocaleString('en-US');

    var list = this.purposeList();
    var current = list.filter(function (p) { return p.id === s.purpose; })[0] || list[0];
    var purposes = list.map(function (p) {
      var on = p.id === current.id;
      return {
        label: p.label, icon: p.icon, on: on,
        pick: function () { self.setState({ purpose: p.id }); },
        bg: on ? accent : '#FFFFFF', fg: on ? '#FFFFFF' : '#0A0B0D', bd: on ? accent : '#8A93A3'
      };
    });

    function setter(name, kind) {
      return function (e) {
        var patch = {};
        patch[name] = kind === 'checked' ? !!e.target.checked : kind === 'number' ? Number(e.target.value) : kind === 'upper' ? String(e.target.value).toUpperCase() : e.target.value;
        if (errors[name]) { patch.errors = Object.assign({}, errors); delete patch.errors[name]; }
        self.setState(patch);
      };
    }
    var fields = ['bizName', 'dba', 'industry', 'structure', 'startDate', 'ein', 'bizStreet', 'bizCity', 'bizState', 'zip', 'revenue', 'credit', 'loanBalance', 'first', 'last', 'ownership', 'dob', 'ssn', 'homeStreet', 'homeCity', 'homeState', 'homeZip', 'email', 'phone', 'password', 'signature'];
    var v = { amount: s.amount, consent: !!s.consent, consentCredit: !!s.consentCredit };
    var on = { amount: setter('amount', 'number'), consent: setter('consent', 'checked'), consentCredit: setter('consentCredit', 'checked') };
    var err = { hasLoans: errors.hasLoans || '', bank: errors.bank || '', consent: errors.consent || '', consentCredit: errors.consentCredit || '' }, bad = {};
    fields.forEach(function (f) {
      v[f] = s[f];
      on[f] = setter(f, f === 'bizState' || f === 'homeState' ? 'upper' : 'text');
      err[f] = errors[f] || '';
      bad[f] = !!errors[f];
    });

    function yesNo(value) {
      var isOn = s.hasLoans === value;
      return {
        on: isOn,
        pick: function () { var rest = Object.assign({}, errors); delete rest.hasLoans; self.setState({ hasLoans: value, errors: rest }); },
        bg: isOn ? accent : '#FFFFFF', fg: isOn ? '#FFFFFF' : '#0A0B0D', bd: isOn ? accent : '#8A93A3'
      };
    }

    function advance() {
      var found = strict ? self.check(s) : {};
      if (Object.keys(found).length) { self.setState({ errors: found }); return; }
      if (s.step < last) self.setState({ step: s.step + 1, errors: {} });
      else { self.remember(s, current.label); self.setState({ done: true, errors: {}, ssn: '', ein: '', password: '' }); }
      self.toTop();
    }

    var steps = ['Funding', 'Business', 'Revenue', 'Owner', 'Bank', 'Sign'].map(function (label, i) {
      var n = i + 1, done = n < s.step, now = n === s.step, lit = done || now;
      return {
        num: n, label: label, done: done, todo: !done,
        current: now ? 'step' : null,
        flex: n < last ? '1 1 0%' : '0 0 auto',
        line: n < last,
        bg: lit ? accent : '#FFFFFF', fg: lit ? '#FFFFFF' : '#4A5261', bd: lit ? accent : '#8A93A3',
        lineBg: done ? accent : '#D5DEEC',
        weight: now ? 600 : 500,
        labelFg: now ? '#0A0B0D' : '#4A5261'
      };
    });

    var first = (s.first || '').trim();
    return {
      accent: accent,
      steps: steps,
      isForm: !s.done,
      isDone: !!s.done,
      is1: !s.done && s.step === 1,
      is2: !s.done && s.step === 2,
      is3: !s.done && s.step === 3,
      is4: !s.done && s.step === 4,
      is5: !s.done && s.step === 5,
      is6: !s.done && s.step === 6,
      stepNum: s.step,
      stepName: names[s.step],
      canBack: s.step > 1,
      canEdit: !s.done && s.step > 1,
      nextLabel: s.step === last ? 'Sign and submit' : 'Continue',
      showLoanBalance: s.hasLoans === 'yes',
      reviewBusiness: s.bizName.trim() || 'Not entered',
      reviewOwner: (s.first.trim() + ' ' + s.last.trim()).trim() || 'Not entered',
      reviewRequest: amountText + ' for ' + current.label.toLowerCase(),
      today: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
      next: advance,
      back: function () { self.setState({ step: Math.max(1, s.step - 1), errors: {} }); self.toTop(); },
      editRequest: function () { self.setState({ step: 1, errors: {} }); self.toTop(); },
      v: v, on: on, err: err, bad: bad,
      amountText: amountText,
      purposes: purposes,
      purposeLabel: current.label,
      loanYes: yesNo('yes'),
      loanNo: yesNo('no'),
      bankOff: !s.bankConnected,
      bankOn: !!s.bankConnected,
      connectBank: function () { self.setState({ bankConnected: true, errors: {} }); },
      onFiles: function (e) {
        var picked = [];
        var fl = (e.target && e.target.files) || [];
        for (var i = 0; i < fl.length; i++) picked.push({ name: fl[i].name });
        self.setState({ files: picked, errors: {} });
      },
      files: s.files,
      hasFiles: s.files.length > 0,
      skipBank: function () { self.setState({ step: 6, errors: {} }); self.toTop(); },
      doneTitle: first ? 'Application received, ' + first + '.' : 'Application received.'
    };
  }
}
mountPage(Component, {"accent": "#0066FF", "requireFields": true});
</script>
