<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | CapDeck</title>
<meta name="description" content="Sign in to see your CapDeck approvals.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6FA}
a{color:#0A0B0D}a:hover{color:#0066FF}
button,input,select{font-family:inherit}
button{cursor:pointer}
.inp{width:100%;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid #8A93A3;border-radius:10px;background:#FFFFFF;color:#0A0B0D;font-size:16px}
.inp[aria-invalid="true"]{border-color:#B42318;box-shadow:0 0 0 1px #B42318}
.btn{transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
a:focus-visible,button:focus-visible{outline:3px solid #0066FF;outline-offset:3px}
input:focus-visible,select:focus-visible{outline:3px solid #0066FF;outline-offset:1px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<noscript><p style="font-family: system-ui, sans-serif; padding: 24px">This page needs JavaScript turned on.</p></noscript>
<div id="root"></div>
<template id="tpl">
<div style="font-family: 'Geist', system-ui, sans-serif; color: #0A0B0D; background: #F4F6FA; line-height: 1.5; font-size: 17px; min-height: 100vh">

<div style="background: #EEF4FF; font-size: 14px; text-align: center; padding: 8px 16px">Prototype with sample data. Nothing you enter here is saved or sent.</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E7EE">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px clamp(16px, 3vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; min-height: 44px"><img src="assets/capdeck-logo.png" alt="CapDeck home" width="1919" height="295" style="display: block; height: clamp(22px, 2vw, 28px); width: auto"></a>
<a href="apply.html" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Start an application</a>
</div>
</header>

<main style="max-width: 440px; margin: 0 auto; padding: clamp(32px, 7vw, 88px) 16px 72px">
<div style="background: #FFFFFF; border: 1px solid #DDE2EA; border-radius: 16px; padding: clamp(24px, 4vw, 40px); display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Outfit', 'Geist', system-ui, sans-serif; font-weight: 600; font-size: clamp(28px, 3vw, 36px); letter-spacing: -0.02em; line-height: 1.1">Sign in</h1>
<p style="margin: 0; color: #4A5261">See your approvals and choose an offer.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 600">Email</label>
<input class="inp" id="email" name="email" type="email" autocomplete="username" value="{{v.email}}" onChange="{{on.email}}" aria-invalid="{{bad.email}}">
<sc-if value="{{err.email}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.email}}</div></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<label for="password" style="font-size: 14px; font-weight: 600">Password</label>
<a href="#reset" style="font-size: 14px">Forgot password?</a>
</div>
<input class="inp" id="password" name="password" type="password" autocomplete="current-password" value="{{v.password}}" onChange="{{on.password}}" aria-invalid="{{bad.password}}">
<sc-if value="{{err.password}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 14px; color: #B42318">{{err.password}}</div></sc-if>
</div>
<a class="btn" href="approvals.html" onClick="{{trySignIn}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Sign in<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<div style="font-size: 15px; color: #4A5261; text-align: center">New to CapDeck? <a href="apply.html" style="font-weight: 600">Start an application</a></div>
</div>
</main>

</div>
</template>
<script>
/* Small page runtime: renders the page template from the Component's values and keeps it in sync. */
(function () {
  'use strict';
  var HOLE = /\{\{([^}]+)\}\}/g;
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  function text(v) {
    return v == null || v === false ? '' : String(v);
  }

  function fill(str, scope) {
    return str.replace(HOLE, function (_, p) { return text(lookup(scope, p)); });
  }

  function eventFor(el, name) {
    var type = name.slice(2).toLowerCase();
    if (type === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' && t !== 'file')) return 'input';
    }
    return type;
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(fill(node.data, scope)));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName, c;
    if (tag === 'sc-for') {
      var m = WHOLE.exec(node.getAttribute('list') || '');
      var list = m ? lookup(scope, m[1]) : null;
      var as = node.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var inner = Object.create(scope);
        inner[as] = item;
        inner.$index = idx;
        for (var k = node.firstChild; k; k = k.nextSibling) build(k, inner, out);
      });
      return;
    }
    if (tag === 'sc-if') {
      var mi = WHOLE.exec(node.getAttribute('value') || '');
      if (mi && lookup(scope, mi[1])) for (c = node.firstChild; c; c = c.nextSibling) build(c, scope, out);
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName), handlers = null;
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, w = WHOLE.exec(a.value);
      if (w) {
        var raw = lookup(scope, w[1]);
        if (name.slice(0, 2) === 'on') {
          if (typeof raw === 'function') (handlers = handlers || {})[name] = raw;
        } else if (raw === true) {
          el.setAttribute(name, name.slice(0, 5) === 'aria-' ? 'true' : '');
        } else if (raw === false) {
          if (name.slice(0, 5) === 'aria-') el.setAttribute(name, 'false');
        } else if (raw != null) {
          el.setAttribute(name, String(raw));
        }
      } else {
        el.setAttribute(name, fill(a.value, scope));
      }
    }
    if (handlers) {
      el.__h = {};
      for (var key in handlers) el.__h[eventFor(el, key)] = handlers[key];
    }
    for (c = node.firstChild; c; c = c.nextSibling) build(c, scope, el);
    out.appendChild(el);
  }

  function syncAttrs(live, next) {
    var i, a;
    for (i = live.attributes.length - 1; i >= 0; i--) {
      a = live.attributes[i];
      if (!next.hasAttribute(a.name)) live.removeAttribute(a.name);
    }
    for (i = 0; i < next.attributes.length; i++) {
      a = next.attributes[i];
      if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
    }
    live.__h = next.__h || null;
  }

  function syncControl(live, next) {
    var tag = live.tagName;
    if (tag === 'INPUT') {
      var t = (live.getAttribute('type') || '').toLowerCase();
      if (t === 'checkbox' || t === 'radio') {
        var on = next.hasAttribute('checked');
        if (live.checked !== on) live.checked = on;
      } else if (t !== 'file' && next.hasAttribute('value') && live.value !== next.getAttribute('value')) {
        live.value = next.getAttribute('value');
      }
    } else if ((tag === 'SELECT' || tag === 'TEXTAREA') && next.hasAttribute('value') && live.value !== next.getAttribute('value')) {
      live.value = next.getAttribute('value');
    }
  }

  function settle(node) {
    if (node.nodeType !== 1) return;
    var all = [node].concat([].slice.call(node.querySelectorAll('*')));
    all.forEach(function (el) { if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') syncControl(el, el); });
  }

  function sameKind(live, next) {
    if (live.nodeType !== next.nodeType || live.nodeName !== next.nodeName) return false;
    if (live.nodeType !== 1) return true;
    if (live.namespaceURI !== next.namespaceURI) return false;
    if ((live.getAttribute('id') || '') !== (next.getAttribute('id') || '')) return false;
    if (live.tagName === 'INPUT' && live.getAttribute('type') !== next.getAttribute('type')) return false;
    return true;
  }

  function morph(liveParent, nextParent) {
    var live = liveParent.firstChild, next = nextParent.firstChild;
    while (next) {
      var after = next.nextSibling;
      if (!live) {
        liveParent.appendChild(next);
        settle(next);
      } else if (!sameKind(live, next)) {
        var dead = live;
        live = live.nextSibling;
        liveParent.replaceChild(next, dead);
        settle(next);
      } else {
        if (live.nodeType === 3) {
          if (live.data !== next.data) live.data = next.data;
        } else {
          syncAttrs(live, next);
          morph(live, next);
          syncControl(live, next);
        }
        live = live.nextSibling;
      }
      next = after;
    }
    while (live) {
      var gone = live;
      live = live.nextSibling;
      liveParent.removeChild(gone);
    }
  }

  function DCLogic(props) {
    this.props = props || {};
  }
  DCLogic.prototype.setState = function (patch) {
    var add = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, add);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () {
    if (this.__render) this.__render();
  };
  window.DCLogic = DCLogic;

  window.mountPage = function (Component, props) {
    var root = document.getElementById('root');
    var tpl = document.getElementById('tpl').content;
    var page = new Component(props);
    var queued = false;

    function render() {
      queued = false;
      var vals = page.renderVals() || {};
      var next = document.createElement('div');
      for (var n = tpl.firstChild; n; n = n.nextSibling) build(n, vals, next);
      morph(root, next);
    }
    page.__render = function () {
      if (queued) return;
      queued = true;
      Promise.resolve().then(render);
    };

    ['click', 'input', 'change', 'submit'].forEach(function (type) {
      root.addEventListener(type, function (e) {
        var n = e.target;
        while (n && n !== root.parentNode) {
          if (n.__h && n.__h[type]) n.__h[type](e);
          n = n.parentNode;
        }
      });
    });

    render();
    if (typeof page.componentDidMount === 'function') page.componentDidMount();
  };
})();
</script>
<script>
class Component extends DCLogic {
  state = { email: '', password: '', errors: {} };

  renderVals() {
    var self = this;
    var s = this.state;
    var accent = this.props.accent ?? '#0066FF';
    var strict = this.props.requireFields ?? true;
    var errors = s.errors || {};

    function setter(name) {
      return function (e) {
        var patch = {};
        patch[name] = e.target.value;
        if (errors[name]) { patch.errors = Object.assign({}, errors); delete patch.errors[name]; }
        self.setState(patch);
      };
    }

    return {
      accent: accent,
      v: { email: s.email, password: s.password },
      on: { email: setter('email'), password: setter('password') },
      err: { email: errors.email || '', password: errors.password || '' },
      bad: { email: !!errors.email, password: !!errors.password },
      trySignIn: function (e) {
        if (!strict) return;
        var found = {};
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())) found.email = 'Enter the email you applied with.';
        if (!s.password) found.password = 'Enter your password.';
        if (Object.keys(found).length) {
          if (e && e.preventDefault) e.preventDefault();
          self.setState({ errors: found });
        }
      }
    };
  }
}
mountPage(Component, {"accent": "#0066FF", "requireFields": true});
</script>
</body>
</html>
